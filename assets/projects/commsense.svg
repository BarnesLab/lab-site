<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2f2d"/>
      <stop offset="100%" style="stop-color:#1b3a5c"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#bg)"/>
  <!-- Person 1 (patient) -->
  <circle cx="160" cy="100" r="28" fill="none" stroke="#5ad7f0" stroke-width="2" opacity="0.6"/>
  <circle cx="160" cy="90" r="10" fill="#5ad7f0" opacity="0.15"/>
  <path d="M140,118 Q160,135 180,118" fill="none" stroke="#5ad7f0" stroke-width="1.5" opacity="0.4"/>
  <!-- Person 2 (clinician) -->
  <circle cx="440" cy="100" r="28" fill="none" stroke="#2aafbe" stroke-width="2" opacity="0.6"/>
  <circle cx="440" cy="90" r="10" fill="#2aafbe" opacity="0.15"/>
  <path d="M420,118 Q440,135 460,118" fill="none" stroke="#2aafbe" stroke-width="1.5" opacity="0.4"/>
  <!-- Speech/conversation waves between them -->
  <path d="M195,95 Q250,70 305,95" fill="none" stroke="#5ad7f0" stroke-width="1.5" opacity="0.4"/>
  <path d="M195,100 Q250,80 305,100" fill="none" stroke="#5ad7f0" stroke-width="1" opacity="0.25"/>
  <path d="M295,105 Q350,130 405,105" fill="none" stroke="#2aafbe" stroke-width="1.5" opacity="0.4"/>
  <path d="M295,110 Q350,135 405,110" fill="none" stroke="#2aafbe" stroke-width="1" opacity="0.25"/>
  <!-- Audio waveform in the middle -->
  <line x1="270" y1="95" x2="270" y2="115" stroke="#5ad7f0" stroke-width="2" opacity="0.5"/>
  <line x1="278" y1="88" x2="278" y2="122" stroke="#5ad7f0" stroke-width="2" opacity="0.6"/>
  <line x1="286" y1="82" x2="286" y2="128" stroke="#5ad7f0" stroke-width="2" opacity="0.7"/>
  <line x1="294" y1="85" x2="294" y2="125" stroke="#2aafbe" stroke-width="2" opacity="0.7"/>
  <line x1="302" y1="80" x2="302" y2="130" stroke="#2aafbe" stroke-width="2" opacity="0.8"/>
  <line x1="310" y1="86" x2="310" y2="124" stroke="#2aafbe" stroke-width="2" opacity="0.65"/>
  <line x1="318" y1="90" x2="318" y2="120" stroke="#2aafbe" stroke-width="2" opacity="0.5"/>
  <line x1="326" y1="94" x2="326" y2="116" stroke="#2aafbe" stroke-width="2" opacity="0.4"/>
  <!-- NLP keywords floating -->
  <rect x="100" y="160" width="80" height="24" rx="12" fill="#2aafbe" opacity="0.12" stroke="#2aafbe" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="140" y="176" text-anchor="middle" font-family="Arial" font-size="10" fill="#5ad7f0" opacity="0.6">empathy</text>
  <rect x="200" y="175" width="90" height="24" rx="12" fill="#2aafbe" opacity="0.12" stroke="#2aafbe" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="245" y="191" text-anchor="middle" font-family="Arial" font-size="10" fill="#5ad7f0" opacity="0.6">rapport</text>
  <rect x="310" y="165" width="100" height="24" rx="12" fill="#2aafbe" opacity="0.12" stroke="#2aafbe" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="360" y="181" text-anchor="middle" font-family="Arial" font-size="10" fill="#5ad7f0" opacity="0.6">turn-taking</text>
  <rect x="430" y="175" width="70" height="24" rx="12" fill="#2aafbe" opacity="0.12" stroke="#2aafbe" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="465" y="191" text-anchor="middle" font-family="Arial" font-size="10" fill="#5ad7f0" opacity="0.6">tone</text>
  <!-- Text -->
  <text x="300" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5ad7f0" opacity="0.6" letter-spacing="3">PATIENT-CLINICIAN COMMUNICATION</text>
</svg>
