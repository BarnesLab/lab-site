<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-label="Smartwatch detecting a conversation between two people">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eefaff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10314f"/>
      <stop offset="1" stop-color="#155e73"/>
    </linearGradient>
  </defs>

  <rect width="1120" height="700" fill="url(#bg)"/>
  <circle cx="1010" cy="90" r="150" fill="#5ad7f0" opacity="0.10"/>
  <circle cx="80" cy="640" r="180" fill="#0e8a96" opacity="0.08"/>
  <circle cx="520" cy="110" r="6" fill="#0e8a96" opacity="0.25"/>
  <circle cx="470" cy="560" r="5" fill="#14697a" opacity="0.22"/>
  <circle cx="1040" cy="480" r="7" fill="#5ad7f0" opacity="0.30"/>

  <!-- ===== smartwatch ===== -->
  <g>
    <!-- straps -->
    <rect x="258" y="96" width="84" height="190" rx="30" fill="#14697a"/>
    <rect x="278" y="136" width="44" height="7" rx="3.5" fill="#2a8ba0"/>
    <rect x="278" y="166" width="44" height="7" rx="3.5" fill="#2a8ba0"/>
    <rect x="278" y="196" width="44" height="7" rx="3.5" fill="#2a8ba0"/>
    <rect x="258" y="474" width="84" height="190" rx="30" fill="#14697a"/>
    <rect x="278" y="520" width="44" height="7" rx="3.5" fill="#2a8ba0"/>
    <rect x="278" y="550" width="44" height="7" rx="3.5" fill="#2a8ba0"/>
    <rect x="278" y="580" width="44" height="7" rx="3.5" fill="#2a8ba0"/>
    <!-- crown + button -->
    <rect x="398" y="330" width="16" height="46" rx="8" fill="#123b66"/>
    <rect x="398" y="396" width="14" height="30" rx="7" fill="#123b66"/>
    <!-- case + screen -->
    <rect x="196" y="258" width="208" height="244" rx="52" fill="#123b66"/>
    <rect x="212" y="274" width="176" height="212" rx="40" fill="url(#screen)"/>
    <text x="300" y="314" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" letter-spacing="1" fill="#8fe3f5">SocialPulse</text>
    <!-- waveform -->
    <rect x="236" y="369" width="8" height="18" rx="4" fill="#5ad7f0"/>
    <rect x="248" y="360" width="8" height="36" rx="4" fill="#5ad7f0"/>
    <rect x="260" y="349" width="8" height="58" rx="4" fill="#5ad7f0"/>
    <rect x="272" y="338" width="8" height="80" rx="4" fill="#5ad7f0"/>
    <rect x="284" y="353" width="8" height="50" rx="4" fill="#5ad7f0"/>
    <rect x="296" y="343" width="8" height="70" rx="4" fill="#5ad7f0"/>
    <rect x="308" y="362" width="8" height="32" rx="4" fill="#5ad7f0"/>
    <rect x="320" y="350" width="8" height="56" rx="4" fill="#5ad7f0"/>
    <rect x="332" y="340" width="8" height="76" rx="4" fill="#5ad7f0"/>
    <rect x="344" y="358" width="8" height="40" rx="4" fill="#5ad7f0"/>
    <rect x="356" y="370" width="8" height="16" rx="4" fill="#5ad7f0"/>
    <!-- status pill -->
    <rect x="224" y="430" width="152" height="36" rx="18" fill="#5ad7f0" opacity="0.16"/>
    <rect x="224" y="430" width="152" height="36" rx="18" fill="none" stroke="#5ad7f0" stroke-width="2"/>
    <circle cx="246" cy="448" r="5" fill="#5ad7f0"/>
    <text x="260" y="455" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#d6f6ff">Interaction</text>
  </g>

  <!-- ===== sensing pulses ===== -->
  <path d="M446,330 A62,62 0 0 1 446,430" fill="none" stroke="#0e8a96" stroke-width="7" stroke-linecap="round" opacity="0.50"/>
  <path d="M470,300 A95,95 0 0 1 470,460" fill="none" stroke="#0e8a96" stroke-width="7" stroke-linecap="round" opacity="0.32"/>
  <path d="M494,268 A128,128 0 0 1 494,492" fill="none" stroke="#0e8a96" stroke-width="7" stroke-linecap="round" opacity="0.18"/>

  <!-- ===== two people talking ===== -->
  <ellipse cx="645" cy="626" rx="105" ry="13" fill="#123b66" opacity="0.07"/>
  <ellipse cx="885" cy="626" rx="110" ry="13" fill="#123b66" opacity="0.07"/>

  <circle cx="645" cy="325" r="36" fill="#14697a"/>
  <rect x="633" y="352" width="24" height="32" rx="8" fill="#14697a"/>
  <rect x="583" y="380" width="124" height="240" rx="58" fill="#14697a"/>

  <circle cx="885" cy="315" r="38" fill="#0e8a96"/>
  <rect x="873" y="346" width="24" height="32" rx="8" fill="#0e8a96"/>
  <rect x="819" y="372" width="132" height="248" rx="60" fill="#0e8a96"/>

  <!-- speech bubble: person A speaking -->
  <rect x="548" y="150" width="176" height="88" rx="26" fill="#dff2f9"/>
  <path d="M636,237 L652,284 L674,237 Z" fill="#dff2f9"/>
  <rect x="588" y="182" width="10" height="24" rx="5" fill="#14697a"/>
  <rect x="610" y="173" width="10" height="42" rx="5" fill="#14697a"/>
  <rect x="632" y="165" width="10" height="58" rx="5" fill="#14697a"/>
  <rect x="654" y="173" width="10" height="42" rx="5" fill="#14697a"/>
  <rect x="676" y="182" width="10" height="24" rx="5" fill="#14697a"/>

  <!-- speech bubble: person B replying -->
  <rect x="822" y="118" width="150" height="80" rx="26" fill="#0e8a96"/>
  <path d="M898,197 L884,242 L860,197 Z" fill="#0e8a96"/>
  <circle cx="867" cy="158" r="8" fill="#ffffff" opacity="0.95"/>
  <circle cx="897" cy="158" r="8" fill="#ffffff" opacity="0.95"/>
  <circle cx="927" cy="158" r="8" fill="#ffffff" opacity="0.95"/>
</svg>
