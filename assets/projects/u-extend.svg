<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#123b66"/>
      <stop offset="100%" style="stop-color:#0f2f2d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2aafbe"/>
      <stop offset="100%" style="stop-color:#5ad7f0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#bg)"/>
  <!-- Arm/motion trajectory -->
  <path d="M120,180 Q180,80 260,120 Q340,160 380,100 Q420,50 480,90" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.7"/>
  <path d="M120,190 Q190,100 270,135 Q350,170 390,115 Q430,65 490,100" fill="none" stroke="#5ad7f0" stroke-width="1.5" opacity="0.3" stroke-dasharray="6,4"/>
  <path d="M130,200 Q200,120 275,145 Q355,175 395,125 Q435,75 495,108" fill="none" stroke="#5ad7f0" stroke-width="1" opacity="0.2" stroke-dasharray="4,6"/>
  <!-- Data points on trajectory -->
  <circle cx="120" cy="180" r="5" fill="#2aafbe" opacity="0.8"/>
  <circle cx="200" cy="110" r="4" fill="#5ad7f0" opacity="0.6"/>
  <circle cx="260" cy="120" r="5" fill="#2aafbe" opacity="0.8"/>
  <circle cx="340" cy="145" r="4" fill="#5ad7f0" opacity="0.6"/>
  <circle cx="380" cy="100" r="5" fill="#2aafbe" opacity="0.8"/>
  <circle cx="440" cy="65" r="4" fill="#5ad7f0" opacity="0.6"/>
  <circle cx="480" cy="90" r="5" fill="#2aafbe" opacity="0.8"/>
  <!-- Wearable sensor icon (watch) -->
  <rect x="60" y="60" width="44" height="56" rx="8" fill="none" stroke="#5ad7f0" stroke-width="1.5" opacity="0.5"/>
  <rect x="68" y="70" width="28" height="28" rx="4" fill="#5ad7f0" opacity="0.1"/>
  <line x1="82" y1="56" x2="82" y2="62" stroke="#5ad7f0" stroke-width="1.5" opacity="0.4"/>
  <line x1="82" y1="114" x2="82" y2="120" stroke="#5ad7f0" stroke-width="1.5" opacity="0.4"/>
  <!-- Accelerometer axes on watch -->
  <polyline points="72,90 78,82 82,88 86,78 90,86 94,80" fill="none" stroke="#5ad7f0" stroke-width="1" opacity="0.5"/>
  <!-- Bar chart (assessment) -->
  <rect x="500" y="140" width="16" height="60" rx="3" fill="#2aafbe" opacity="0.4"/>
  <rect x="522" y="110" width="16" height="90" rx="3" fill="#2aafbe" opacity="0.55"/>
  <rect x="544" y="130" width="16" height="70" rx="3" fill="#2aafbe" opacity="0.35"/>
  <!-- Decorative -->
  <circle cx="530" cy="50" r="2" fill="#5ad7f0" opacity="0.2"/>
  <circle cx="50" cy="250" r="2" fill="#5ad7f0" opacity="0.15"/>
  <!-- Text -->
  <text x="300" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5ad7f0" opacity="0.6" letter-spacing="3">DIGITAL BIOMARKERS &amp; MOTOR ASSESSMENT</text>
</svg>
