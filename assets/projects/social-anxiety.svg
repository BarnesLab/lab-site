<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2f2d"/>
      <stop offset="100%" style="stop-color:#123b66"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2aafbe"/>
      <stop offset="100%" style="stop-color:#5ad7f0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#bg)"/>
  <!-- Abstract brain/network nodes -->
  <circle cx="200" cy="130" r="36" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.7"/>
  <circle cx="200" cy="130" r="18" fill="url(#accent)" opacity="0.15"/>
  <circle cx="280" cy="90" r="22" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.5"/>
  <circle cx="280" cy="90" r="10" fill="url(#accent)" opacity="0.12"/>
  <circle cx="310" cy="160" r="28" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.6"/>
  <circle cx="310" cy="160" r="12" fill="url(#accent)" opacity="0.12"/>
  <circle cx="150" cy="180" r="18" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.4"/>
  <circle cx="150" cy="180" r="8" fill="url(#accent)" opacity="0.1"/>
  <circle cx="250" cy="200" r="14" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.35"/>
  <circle cx="370" cy="110" r="16" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.35"/>
  <!-- Connection lines -->
  <line x1="200" y1="130" x2="280" y2="90" stroke="#5ad7f0" stroke-width="1" opacity="0.3"/>
  <line x1="200" y1="130" x2="310" y2="160" stroke="#5ad7f0" stroke-width="1" opacity="0.3"/>
  <line x1="280" y1="90" x2="310" y2="160" stroke="#5ad7f0" stroke-width="1" opacity="0.25"/>
  <line x1="200" y1="130" x2="150" y2="180" stroke="#5ad7f0" stroke-width="1" opacity="0.25"/>
  <line x1="310" y1="160" x2="250" y2="200" stroke="#5ad7f0" stroke-width="1" opacity="0.2"/>
  <line x1="280" y1="90" x2="370" y2="110" stroke="#5ad7f0" stroke-width="1" opacity="0.2"/>
  <line x1="150" y1="180" x2="250" y2="200" stroke="#5ad7f0" stroke-width="1" opacity="0.2"/>
  <!-- Phone icon -->
  <rect x="420" y="80" width="60" height="110" rx="10" fill="none" stroke="#5ad7f0" stroke-width="2" opacity="0.6"/>
  <rect x="430" y="95" width="40" height="65" rx="3" fill="#5ad7f0" opacity="0.1"/>
  <circle cx="450" cy="175" r="5" fill="#5ad7f0" opacity="0.4"/>
  <!-- Pulse line on phone -->
  <polyline points="432,125 438,125 442,110 446,140 450,118 454,130 458,125 468,125" fill="none" stroke="#5ad7f0" stroke-width="1.5" opacity="0.6"/>
  <!-- Decorative dots -->
  <circle cx="50" cy="50" r="3" fill="#5ad7f0" opacity="0.2"/>
  <circle cx="550" cy="250" r="3" fill="#5ad7f0" opacity="0.2"/>
  <circle cx="530" cy="50" r="2" fill="#5ad7f0" opacity="0.15"/>
  <circle cx="80" cy="250" r="2" fill="#5ad7f0" opacity="0.15"/>
  <!-- Text -->
  <text x="300" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5ad7f0" opacity="0.6" letter-spacing="3">CONTEXT-AWARE MICRO-INTERVENTIONS</text>
</svg>
