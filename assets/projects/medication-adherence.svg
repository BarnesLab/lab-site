<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2f2d"/>
      <stop offset="100%" style="stop-color:#123b66"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#bg)"/>
  <!-- Pill/capsule icon -->
  <rect x="140" y="85" width="90" height="40" rx="20" fill="none" stroke="#5ad7f0" stroke-width="2" opacity="0.6" transform="rotate(-20,185,105)"/>
  <rect x="140" y="85" width="45" height="40" rx="20" fill="#2aafbe" opacity="0.15" transform="rotate(-20,185,105)"/>
  <!-- Calendar/schedule grid -->
  <rect x="300" y="60" width="140" height="120" rx="8" fill="none" stroke="#5ad7f0" stroke-width="1.5" opacity="0.4"/>
  <line x1="300" y1="85" x2="440" y2="85" stroke="#5ad7f0" stroke-width="1" opacity="0.3"/>
  <!-- Calendar grid lines -->
  <line x1="335" y1="85" x2="335" y2="180" stroke="#5ad7f0" stroke-width="0.5" opacity="0.15"/>
  <line x1="370" y1="85" x2="370" y2="180" stroke="#5ad7f0" stroke-width="0.5" opacity="0.15"/>
  <line x1="405" y1="85" x2="405" y2="180" stroke="#5ad7f0" stroke-width="0.5" opacity="0.15"/>
  <line x1="300" y1="110" x2="440" y2="110" stroke="#5ad7f0" stroke-width="0.5" opacity="0.15"/>
  <line x1="300" y1="135" x2="440" y2="135" stroke="#5ad7f0" stroke-width="0.5" opacity="0.15"/>
  <line x1="300" y1="160" x2="440" y2="160" stroke="#5ad7f0" stroke-width="0.5" opacity="0.15"/>
  <!-- Check marks (adherent days) -->
  <polyline points="310,98 315,103 325,93" fill="none" stroke="#2aafbe" stroke-width="1.5" opacity="0.6"/>
  <polyline points="345,98 350,103 360,93" fill="none" stroke="#2aafbe" stroke-width="1.5" opacity="0.6"/>
  <polyline points="380,98 385,103 395,93" fill="none" stroke="#2aafbe" stroke-width="1.5" opacity="0.6"/>
  <polyline points="310,123 315,128 325,118" fill="none" stroke="#2aafbe" stroke-width="1.5" opacity="0.6"/>
  <polyline points="345,123 350,128 360,118" fill="none" stroke="#2aafbe" stroke-width="1.5" opacity="0.6"/>
  <!-- X marks (missed days) -->
  <line x1="413" y1="93" x2="425" y2="105" stroke="#5ad7f0" stroke-width="1.5" opacity="0.35"/>
  <line x1="425" y1="93" x2="413" y2="105" stroke="#5ad7f0" stroke-width="1.5" opacity="0.35"/>
  <line x1="378" y1="120" x2="390" y2="132" stroke="#5ad7f0" stroke-width="1.5" opacity="0.35"/>
  <line x1="390" y1="120" x2="378" y2="132" stroke="#5ad7f0" stroke-width="1.5" opacity="0.35"/>
  <!-- Smartwatch icon -->
  <rect x="480" y="95" width="34" height="44" rx="6" fill="none" stroke="#5ad7f0" stroke-width="1.5" opacity="0.4"/>
  <rect x="486" y="103" width="22" height="22" rx="3" fill="#5ad7f0" opacity="0.08"/>
  <polyline points="488,115 493,109 497,117 501,107 505,113" fill="none" stroke="#5ad7f0" stroke-width="1" opacity="0.4"/>
  <line x1="497" y1="91" x2="497" y2="97" stroke="#5ad7f0" stroke-width="1.5" opacity="0.3"/>
  <line x1="497" y1="137" x2="497" y2="143" stroke="#5ad7f0" stroke-width="1.5" opacity="0.3"/>
  <!-- Trend arrow going up -->
  <polyline points="120,200 200,185 280,175 360,160 440,140" fill="none" stroke="#2aafbe" stroke-width="2" opacity="0.4"/>
  <polygon points="440,140 432,148 440,145 448,148" fill="#2aafbe" opacity="0.4"/>
  <!-- Data dots on trend -->
  <circle cx="120" cy="200" r="3" fill="#5ad7f0" opacity="0.4"/>
  <circle cx="200" cy="185" r="3" fill="#5ad7f0" opacity="0.4"/>
  <circle cx="280" cy="175" r="3" fill="#5ad7f0" opacity="0.4"/>
  <circle cx="360" cy="160" r="3" fill="#5ad7f0" opacity="0.4"/>
  <!-- Text -->
  <text x="300" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5ad7f0" opacity="0.6" letter-spacing="3">MEDICATION ADHERENCE MONITORING</text>
</svg>
